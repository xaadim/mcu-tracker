<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marvel Tracker – Ordre chronologique</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--tx:#14141a;--mu:#6b6b78;--ac:#e62429;--bd:#dcdce2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e12;--card:#1a1a21;--tx:#f2f2f5;--mu:#9a9aa8;--bd:#2c2c36}}
:root[data-theme="dark"]{--bg:#0e0e12;--card:#1a1a21;--tx:#f2f2f5;--mu:#9a9aa8;--bd:#2c2c36}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.w{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:Impact,"Arial Narrow",sans-serif;letter-spacing:.06em;font-size:clamp(2rem,6vw,3.2rem);margin:0;color:var(--ac)}
.sub{color:var(--mu);margin:4px 0 18px}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .3s}
.st{display:flex;justify-content:space-between;color:var(--mu);font-size:.9rem;margin:6px 0 16px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.ctl input{flex:1 1 200px;padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--tx);padding:9px 12px;font:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden;cursor:pointer;position:relative;transition:transform .15s}
.c:hover{transform:translateY(-3px)}
.p{aspect-ratio:2/3;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff;position:relative;background-size:cover;background-position:center}
.p b{font-family:Impact,"Arial Narrow",sans-serif;font-weight:400;letter-spacing:.03em;font-size:1.15rem;line-height:1.1;text-transform:uppercase;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.p small{opacity:.9;margin-top:4px}
.n{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 7px;font-size:.78rem}
.t{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:1px 7px;font-size:.72rem}
.nt{padding:6px 10px;font-size:.74rem;color:var(--mu);min-height:30px}
.ck{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;border-top:1px solid var(--bd);font-size:.85rem;color:var(--mu)}
.c.v .ck{background:var(--ac);color:#fff;border-color:var(--ac)}
.c.v .p{filter:grayscale(.7) brightness(.7)}
.em{text-align:center;color:var(--mu);padding:40px 0;display:none}
.c.hp .p b,.c.hp .p small{display:none}
.c.hp .p{background-color:#000}
</style>
</head>
<body>
<div class="w">
  <h1>MARVEL TRACKER</h1>
  <p class="sub" id="sub"></p>
  <div class="bar"><i id="bar"></i></div>
  <div class="st"><span id="s1"></span><span id="s2"></span></div>
  <div class="ctl">
    <input id="q" type="search" placeholder="Rechercher…">
    <div class="seg" id="f1"><button data-v="all" class="on">Tous</button><button data-v="todo">À voir</button><button data-v="done">Vus</button></div>
    <div class="seg" id="f2"><button data-v="all" class="on">Tout</button><button data-v="f">Films</button><button data-v="s">Séries</button><button data-v="n">Netflix</button></div>
  </div>
  <div class="g" id="g"></div>
  <div class="em" id="em"><b>Aucun résultat trouvé</b><br>Modifiez la recherche ou vos filtres.</div>
</div>
<script>
// [titre, année de sortie, f=film / s=série, note]
// poster: renseigne une URL d’affiche (ex. TMDB) si tu héberges toi-même la page.
const D=[
["Eyes of Wakanda",2025,"s","1260 av. J.-C. – placée en tête par Disney+ depuis août 2025"],
["Captain America: First Avenger",2011,"f","1942–1945"],
["Captain Marvel",2019,"f","1995"],
["Iron Man",2008,"f"],
["Iron Man 2",2010,"f"],
["L’Incroyable Hulk",2008,"f"],
["Thor",2011,"f"],
["Avengers",2012,"f"],
["Thor: Le Monde des ténèbres",2013,"f"],
["Iron Man 3",2013,"f"],
["Captain America: Le Soldat de l’hiver",2014,"f"],
["Les Gardiens de la Galaxie",2014,"f"],
["Les Gardiens de la Galaxie Vol. 2",2017,"f"],
["Daredevil (S1)",2015,"n","Début 2015"],
["Jessica Jones (S1)",2015,"n","2015"],
["Avengers: L’Ère d’Ultron",2015,"f"],
["Ant-Man",2015,"f"],
["Captain America: Civil War",2016,"f"],
["Black Widow",2021,"f","Se déroule après Civil War"],
["Daredevil (S2)",2016,"n"],
["The Punisher (S1)",2017,"n"],
["Luke Cage (S1)",2016,"n"],
["Iron Fist (S1)",2017,"n"],
["The Defenders",2017,"n"],
["Black Panther",2018,"f"],
["Spider-Man: Homecoming",2017,"f"],
["Doctor Strange",2016,"f"],
["Thor: Ragnarok",2017,"f"],
["Ant-Man et la Guêpe",2018,"f"],
["Jessica Jones (S2)",2018,"n","Placement approximatif"],
["Luke Cage (S2)",2018,"n","Placement approximatif"],
["Iron Fist (S2)",2018,"n","Placement approximatif"],
["The Punisher (S2)",2019,"n","Placement approximatif"],
["Daredevil (S3)",2018,"n","Placement approximatif"],
["Jessica Jones (S3)",2019,"n","Placement approximatif"],
["Avengers: Infinity War",2018,"f"],
["Avengers: Endgame",2019,"f"],
["Loki (S1–S2)",2021,"s","Placée après Endgame par Disney+"],
["What If…? (S1–S3)",2021,"s","Multivers, hors chronologie principale"],
["WandaVision",2021,"s"],
["Falcon et le Soldat de l’hiver",2021,"s"],
["Shang-Chi et la Légende des Dix Anneaux",2021,"f"],
["Les Éternels",2021,"f"],
["Spider-Man: No Way Home",2021,"f"],
["Hawkeye",2021,"s"],
["Moon Knight",2022,"s"],
["Doctor Strange in the Multiverse of Madness",2022,"f"],
["Ms. Marvel",2022,"s"],
["Thor: Love and Thunder",2022,"f"],
["Black Panther: Wakanda Forever",2022,"f"],
["I Am Groot",2022,"s","Courts métrages"],
["Miss Hulk: Avocate",2022,"s"],
["Werewolf by Night",2022,"f","Spécial TV"],
["Les Gardiens de la Galaxie: Spécial Fêtes",2022,"f","Spécial TV"],
["Ant-Man et la Guêpe: Quantumania",2023,"f"],
["Les Gardiens de la Galaxie Vol. 3",2023,"f"],
["Secret Invasion",2023,"s"],
["The Marvels",2023,"f"],
["Echo",2024,"s"],
["Deadpool & Wolverine",2024,"f"],
["Agatha All Along",2024,"s"],
["Daredevil: Born Again (S1)",2025,"s"],
["Captain America: Brave New World",2025,"f"],
["Ironheart",2025,"s"],
["Thunderbolts*",2025,"f"],
["Wonder Man",2026,"s","Placement à confirmer"],
["Marvel Zombies",2025,"s","Univers alternatif (suite de What If…?)"],
["Daredevil: Born Again (S2)",2026,"s"],
["Les 4 Fantastiques: Premiers Pas",2025,"f","Terre-828, hors chronologie principale"],
["Spider-Man: Brand New Day",2026,"f"],
["Avengers: Doomsday",2026,"c","Au cinéma : 16 déc. 2026 en France (18 déc. aux États-Unis) – placement dans la chronologie non confirmé"]
];
const K="mcu-tracker-v2";let seen={};
try{seen=JSON.parse(localStorage.getItem(K)||"{}")||{}}catch(e){seen={}}
const st={q:"",a:"all",b:"all"};
const g=document.getElementById("g");
document.getElementById("sub").textContent="Chronologie officielle ("+D.length+" œuvres) – progression enregistrée automatiquement.";
D.forEach((d,i)=>{
  const c=document.createElement("div");c.className="c";c.dataset.i=i;
  const h=(i*7+350)%360;
  const poster=d[4]?"url("+d[4]+")":"linear-gradient(160deg,hsl("+h+",65%,38%),hsl("+((h+40)%360)+",70%,14%))";
  c.innerHTML='<div class="p" style="background-image:'+poster+'"><span class="n">#'+(i+1)+'</span><span class="t">'+(d[2]=="f"?"Film":d[2]=="n"?"Netflix":d[2]=="c"?"Cinéma":"Série")+'</span><b></b><small>'+d[1]+'</small></div><div class="nt"></div><div class="ck"></div>';
  c.querySelector("b").textContent=d[0];c.querySelector(".nt").textContent=d[3]||"";
  c.onclick=()=>{if(seen[i])delete seen[i];else seen[i]=1;try{localStorage.setItem(K,JSON.stringify(seen))}catch(e){}render()};
  g.appendChild(c);
});
function render(){
  let n=0,shown=0;
  [...g.children].forEach((c,i)=>{
    const v=!!seen[i];if(v)n++;c.classList.toggle("v",v);
    c.querySelector(".ck").textContent=v?"✓ Vu":"Marquer comme vu";
    const d=D[i];
    const ok=(st.a=="all"||(st.a=="done")==v)&&(st.b=="all"||d[2]==st.b||(st.b=="s"&&d[2]=="n")||(st.b=="f"&&d[2]=="c"))&&(!st.q||d[0].toLowerCase().includes(st.q));
    c.style.display=ok?"":"none";if(ok)shown++;
  });
  const p=Math.round(n/D.length*100);
  document.getElementById("bar").style.width=p+"%";
  document.getElementById("s1").textContent="Visionnés : "+n+" / "+D.length+" ("+p+"%)";
  document.getElementById("s2").textContent=(D.length-n)+" restants";
  document.getElementById("em").style.display=shown?"none":"block";
}
document.getElementById("q").oninput=e=>{st.q=e.target.value.trim().toLowerCase();render()};
[["f1","a"],["f2","b"]].forEach(([id,k])=>{
  document.getElementById(id).onclick=e=>{const b=e.target.closest("button");if(!b)return;
    [...b.parentNode.children].forEach(x=>x.classList.toggle("on",x==b));st[k]=b.dataset.v;render()};
});
render();

// ===== Affiches TMDB (à héberger toi-même : clé API gratuite sur themoviedb.org) =====
const TMDB_KEY="";   // optionnel : clé TMDB (v3). Vide = affiches via Wikipédia, sans clé
const PK="mcu-posters-v1";let pc={};
try{pc=JSON.parse(localStorage.getItem(PK)||"{}")||{}}catch(e){pc={}}
function setPoster(i,path){const c=g.children[i];if(!c||!path)return;
  c.querySelector(".p").style.backgroundImage="url("+(path[0]=="/"?"https://image.tmdb.org/t/p/w342"+path:path)+")";c.classList.add("hp")}
async function loadPosters(){
  for(let i=0;i<D.length;i++){
    if(pc[i]){setPoster(i,pc[i]);continue}
    const d=D[i],name=d[0].replace(/\s*\(.*?\)/,"").replace(/\*/g,"");
    if(!TMDB_KEY){
      try{
        const q=name+(d[2]=="f"||d[2]=="c"?" film Marvel "+d[1]:" série télévisée Marvel");
        const r=await(await fetch("https://fr.wikipedia.org/w/api.php?action=query&generator=search&gsrlimit=4&gsrsearch="+encodeURIComponent(q)+"&prop=pageimages&piprop=thumbnail&pithumbsize=342&format=json&origin=*")).json();
        const ps=Object.values((r.query||{}).pages||{}).filter(p=>p.thumbnail).sort((a,b)=>a.index-b.index);
        if(ps[0]){pc[i]=ps[0].thumbnail.source;setPoster(i,pc[i]);try{localStorage.setItem(PK,JSON.stringify(pc))}catch(e){}}
      }catch(e){}
      continue;
    }
    const kind=d[2]=="f"||d[2]=="c"?"movie":"tv";
    const url="https://api.themoviedb.org/3/search/"+kind+"?api_key="+TMDB_KEY+"&language=fr-FR&query="+encodeURIComponent(name)+(kind=="movie"?"&year="+d[1]:"");
    try{
      const r=await(await fetch(url)).json();
      const hit=(r.results||[]).find(x=>x.poster_path);
      if(hit){pc[i]=hit.poster_path;setPoster(i,hit.poster_path);
        try{localStorage.setItem(PK,JSON.stringify(pc))}catch(e){}}
    }catch(e){}
  }
}
loadPosters();
</script>
</body>
</html>
